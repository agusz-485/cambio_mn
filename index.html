<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Monedas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor del ticker con tasas en vivo -->
    <div class="ticker-container">
        <div class="ticker">
            <span id="liveRates"></span>
        </div>
    </div>

    <h1>Conversor de Monedas</h1>

    <div class="loader" id="loader"></div>

    <!-- Contenedor principal que agrupa el conversor y las cotizaciones -->
    <div class="container">
        
        <!-- Sección del conversor -->
        <div class="converter">
            <label for="amount">Cantidad:</label>
            <input type="number" id="amount" placeholder="Ingrese la cantidad" min="0">

            <label for="fromCurrency">De:</label>
            <div class="currency-container">
                <img id="fromFlag" src="https://flagcdn.com/w40/us.png" class="flag">
                <select id="fromCurrency"></select>
            </div>
            
            <label>A:</label>
            <div class="currency-container">
                <img id="toFlag" src="https://flagcdn.com/w40/eu.png" class="flag">
                <select id="toCurrency"></select>
            </div>

            <button id="convert">Convertir</button>
            <p id="result"></p>
        </div>

        <!-- Sección de cotizaciones del dólar en Argentina -->
        <div class="exchange-rates" id="exchangeRates">
            <h2>Cotizaciones del Dólar en Argentina</h2>
            <ul id="ratesList">
                <!-- Las cotizaciones se cargarán dinámicamente aquí -->
            </ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
